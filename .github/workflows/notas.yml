name: Build Teia e Artigos (notas do Obsidian)

# Regenera a Teia a partir do repo de notas. Dispara:
#  - quando o repo de notas avisa (repository_dispatch), veja o passo de setup no README;
#  - manualmente (workflow_dispatch);
#  - toda segunda-feira às 06:00 de Brasília (fallback semanal);
#  - quando o gerador muda ou um artigo (artigos/*.md) é editado.
# Também regenera artigos.html, que lista as notas da Teia ao lado dos artigos.
on:
  repository_dispatch:
    types: [notas-update]
  workflow_dispatch: {}
  schedule:
    - cron: '0 9 * * 1'   # semanal: segunda-feira, 09:00 UTC = 06:00 em Brasília
  push:
    paths:
      - 'tools/build-notas.mjs'
      - 'tools/build-artigos.mjs'
      - 'tools/artigos-lib.mjs'
      - 'tools/markdown-lib.mjs'
      - 'artigos/**'
      - 'teia.js'
      - 'teia-layout.js'

permissions:
  contents: write

env:
  # repo de notas (pode ser PRIVADO: o Action lê com o secret NOTAS_TOKEN, um token fine-grained somente de leitura).
  NOTAS_REPO: juliocataldo/notas-cyber

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do site
        uses: actions/checkout@v4
      - name: Checkout das notas (vault)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NOTAS_REPO }}
          path: vault
          # Repo privado: usa o secret NOTAS_TOKEN (fine-grained, só o repo de notas, Contents: Read-only).
          # Sem o secret (ou com repo público) cai para o token padrão e o checkout continua funcionando.
          token: ${{ secrets.NOTAS_TOKEN || github.token }}
        continue-on-error: true
      - name: Remove as credenciais do vault do disco
        # o checkout grava o token em vault/.git/config; o gerador só lê os .md, então o .git não faz falta
        run: rm -rf vault/.git
      - name: Resumo do vault (só contagens, sem nomes de arquivo)
        run: |
          echo "arquivos .md: $(find vault -name '*.md' 2>/dev/null | wc -l)"
          echo "outros arquivos: $(find vault -type f ! -name '*.md' 2>/dev/null | wc -l)"
          echo "links simbólicos: $(find vault -type l 2>/dev/null | wc -l)"
          echo "arquivos .md com CRLF: $(grep -rlI $'\r' vault --include='*.md' 2>/dev/null | wc -l)"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gerar Teia
        run: node tools/build-notas.mjs
      - name: Gerar Artigos (e a lista de notas)
        run: node tools/build-artigos.mjs
      - name: Testes das páginas geradas (se falhar, nada é publicado)
        run: |
          node tests/validar-artigos.mjs
          node tests/validar-segredos.mjs
          node tests/validar-teia-layout.mjs
      - name: Commit se houver mudanças
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # segurança: nunca commitar uma Teia vazia (ex.: vault sem notas)
          if ! ls notas/*.html >/dev/null 2>&1; then
            echo "Pasta notas/ vazia — nada a publicar, abortando."; exit 0
          fi
          git add teia-data.js teia.html notas/ artigos.html artigo-*.html
          if git diff --staged --quiet; then
            echo "Sem mudanças na Teia."
          else
            git commit -m "Atualiza Teia e Artigos (notas do Obsidian)"
            # dois Actions podem publicar no mesmo instante; se o push for recusado, integra e tenta de novo
            ok=0
            for i in 1 2 3 4; do
              if git pull --rebase origin main && git push; then ok=1; break; fi
              echo "Push recusado (tentativa $i); tentando de novo."
              sleep $((i * 5))
            done
            [ "$ok" = 1 ]
          fi
