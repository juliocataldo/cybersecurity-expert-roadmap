name: Radar (Vexday)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 */6 * * *'
  push:
    paths: ['tools/build-radar.mjs']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gerar Radar
        env:
          CHAVE_VEXDAY: ${{ secrets.CHAVE_VEXDAY }}
        run: node tools/build-radar.mjs
      - name: Commit se houver mudanças
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add radar.html
          if git diff --staged --quiet; then
            echo "Sem mudanças no Radar."
          else
            git commit -m "Atualiza Radar (Vexday)"
            git push
          fi
