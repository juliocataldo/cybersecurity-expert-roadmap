name: Radar (Vexday)

on:
  workflow_dispatch: {}
  # Cota do plano gratuito da Vexday: 50 requisições por DIA e 10 por minuto, somando todas as chaves da conta.
  # Cada execução usa no máximo 14 (tools/vexday-lib.mjs); 2 execuções por dia = no máximo 28.
  # Por isso NÃO há gatilho por push: cada push no gerador gastaria cota. Para atualizar à mão: Actions > Radar (Vexday) > Run workflow.
  schedule:
    - cron: '30 0,12 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gerar Radar
        env:
          CHAVE_VEXDAY: ${{ secrets.CHAVE_VEXDAY }}
        run: node tools/build-radar.mjs
      - name: Commit se houver mudanças
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add radar-casos.html
          if git diff --staged --quiet; then
            echo "Sem mudanças no Radar."
          else
            git commit -m "Atualiza Radar (Vexday)"
            # dois Actions podem publicar no mesmo instante; se o push for recusado, integra e tenta de novo
            ok=0
            for i in 1 2 3 4; do
              if git pull --rebase origin main && git push; then ok=1; break; fi
              echo "Push recusado (tentativa $i); tentando de novo."
              sleep $((i * 5))
            done
            [ "$ok" = 1 ]
          fi
