<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Trilha gamificada de Cyber Security: fases, missões, checkpoints, XP e conquistas.">
<title>Trilha · Cybersecurity Roadmap</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0a'/%3E%3Cpath d='M9 22 L16 8 L23 22' stroke='%23ff2e93' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site">
  <a class="wordmark" href="./">CYBER<span>/</span>ROADMAP</a>
  <nav aria-label="Seções">
    <a href="./">Guia</a>
    <a href="trilha.html" aria-current="page">Trilha</a>
  </nav>
</header>

<div class="player" aria-label="Seu progresso">
  <div class="lv"><span>Nível <b id="lvNum">1</b></span><b id="lvName">Recruta</b></div>
  <div class="xpwrap">
    <div class="xpbar" role="progressbar" aria-label="XP até o próximo nível" aria-valuemin="0" aria-valuemax="100" id="xpBar"><span id="xpFill"></span></div>
    <span class="mut small" id="xpTxt">0 XP</span>
  </div>
  <div class="stat" title="Dias seguidos estudando"><b id="streak">0</b>dias seguidos</div>
  <div class="stat" title="Missões concluídas"><b id="missCount">0</b>missões</div>
  <div class="acts">
    <button class="sec" id="bBadges">Conquistas</button>
    <button class="sec" id="bSave">Progresso</button>
    <button class="sec" id="bAbout">Como funciona</button>
  </div>
</div>

<main class="game">
  <section class="panel map" aria-label="Mapa da trilha">
    <h2 class="sr">Mapa da trilha</h2>
    <ol id="map"></ol>
  </section>
  <section class="panel" id="phase" aria-live="polite"></section>
</main>

<div class="wrap"><p class="foot">
  Conteúdo original em português, com estrutura inspirada em <a id="credA" target="_blank" rel="noopener noreferrer"></a> e <a id="credB" target="_blank" rel="noopener noreferrer"></a>.
  Seu progresso fica só neste navegador. Atividade formativa, sem nota.
</p></div>

<div id="toasts" aria-live="polite" aria-atomic="false"></div>
<dialog id="dlg"></dialog>
<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script src="trilha.js"></script>
<script src="app.js"></script>
</body>
</html>
